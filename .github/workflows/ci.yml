# AsBuild's own CI: tests with 100% coverage, lint, format and types, on every pull request and on main.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the pinned, hash-checked tools
        run: |
          python -m pip install --quiet --require-hashes --only-binary=:all: -r requirements-dev.txt -r requirements-lint.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Types
        run: python -m mypy

      - name: Tests, 100% coverage of engine and plugin scripts
        run: python -m pytest -p no:cacheprovider --cov --cov-report=term-missing
