# AsBuild's own CI: tests with 100% coverage, lint, format and types, on every pull request and on main.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the pinned, hash-checked tools
        run: |
          python -m pip install --quiet --require-hashes --only-binary=:all: -r requirements-dev.txt -r requirements-lint.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Types
        run: python -m mypy

      - name: Tests, 100% coverage of engine and plugin scripts
        run: python -m pytest -p no:cacheprovider --cov --cov-report=term-missing

  # The clean-install job (D29, engineering-build-loop 2.4): install AsBuild the way the README says, on a clean
  # runner, from this pull request's branch of this repository (the only change from the README), then run the
  # acceptance tests against the installed copy. The two skills need a signed-in Claude session, which CI does not
  # have: they are left to the user walkthrough (D27).
  clean-install:
    name: clean install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      REF: ${{ github.head_ref || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the pinned, hash-checked test tools
        run: |
          python -m pip install --quiet --require-hashes --only-binary=:all: -r requirements-dev.txt

      - name: Install Claude Code, pinned (npm checks its integrity hash)
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.319
          claude --version

      - name: Install AsBuild as the README says, from this branch
        run: |
          claude plugin marketplace add "hevelius-ai/asbuild#$REF"
          claude plugin install asbuild@hevelius-ai
          claude plugin list --json > "$RUNNER_TEMP/installed.json"

      - name: The installed copy is what the repository ships
        run: python tests/install_check.py "$RUNNER_TEMP/installed.json"

      - name: Acceptance tests against the installed copy
        run: |
          rm -rf plugin
          cp -R "$ASBUILD_INSTALLED" plugin
          python -m pytest tests/acceptance -p no:cacheprovider -q
