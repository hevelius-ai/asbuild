# AsBuild, the UNTRUSTED half. Copy this file to .github/workflows/ in your repository.
# It runs the pull request's own code with read-only rights, collects the test results and uploads them.
# It never gives a verdict: asbuild-verdict.yml does, from your main branch.
# Trigger: pull_request only, so the pull request's code never runs with write rights. AsBuild uses no
# repository secrets.

name: asbuild-test

on:
  pull_request:
    branches: [main] # AsBuild judges changes to main only
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: asbuild-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Fetch AsBuild (from hevelius-ai/asbuild, never from this repository)
        run: |
          # Stop unless the engine folder is exactly the one this release was built from (its Git tree id).
          git clone --quiet --depth 1 --branch v0.4.2 https://github.com/hevelius-ai/asbuild "$RUNNER_TEMP/asbuild"
          test "$(git -C "$RUNNER_TEMP/asbuild" rev-parse HEAD:engine)" = "dc377ab304e28a8d8449f3e3ca65cf5d24f0dd42"
          # Run only the checked folder, copied alone, so nothing else in the download can be imported.
          mkdir "$RUNNER_TEMP/asbuild-run"
          cp -R "$RUNNER_TEMP/asbuild/engine" "$RUNNER_TEMP/asbuild-run/engine"
          echo "ASBUILD=$RUNNER_TEMP/asbuild-run" >> "$GITHUB_ENV"
          mkdir -p out

      - name: Install the project (its requirements.txt must include pytest)
        continue-on-error: true # if this fails, the tests cannot run: the verdict says UNRESOLVED
        run: python -m pip install --quiet -r requirements.txt

      - name: Full suite on the pull request
        continue-on-error: true # failing tests are evidence; the verdict decides
        run: python -m pytest --continue-on-collection-errors -o junit_family=xunit2 --junitxml=out/pr.xml

      - name: Acceptance tests, hardened (no conftest, no plugin autoload)
        continue-on-error: true
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest tests/acceptance --noconftest -p no:cacheprovider \
            --continue-on-collection-errors -o junit_family=xunit2 --junitxml=out/acceptance.xml

      # JavaScript and TypeScript checks (v0.4.0): these four steps run only when the repository holds Vitest check
      # files. Each may fail without stopping the others, so a JavaScript failure never skips the Python evidence.
      # Tools start from node_modules/.bin, never through npm run or npx, so package.json scripts play no part.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('tests/acceptance/**/*.test.*') != ''
        continue-on-error: true
        timeout-minutes: 2
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install the project's JavaScript packages (its package-lock.json fixes every version)
        if: hashFiles('tests/acceptance/**/*.test.*') != ''
        continue-on-error: true # if this fails, the checks cannot run: the verdict says UNRESOLVED
        timeout-minutes: 4
        run: |
          if npm ci --no-audit --no-fund --legacy-peer-deps > "$RUNNER_TEMP/npm-ci.log" 2>&1; then
            cat "$RUNNER_TEMP/npm-ci.log"
          else
            cat "$RUNNER_TEMP/npm-ci.log"
            # Only npm's error code, matched by a fixed pattern; anything else is OTHER.
            code=$(grep -m 1 -oE '^npm (error|ERR!) code (EBADPLATFORM|ERESOLVE|EUSAGE)$' "$RUNNER_TEMP/npm-ci.log" \
              | grep -oE '[A-Z]+$' || true)
            echo "${code:-OTHER}" > out/js-install.txt
            exit 1
          fi

      - name: Full suite on the pull request (JavaScript, the project's own Vitest settings)
        if: hashFiles('tests/acceptance/**/*.test.*') != ''
        continue-on-error: true # failing tests are evidence; the verdict decides
        timeout-minutes: 3
        run: node_modules/.bin/vitest run --reporter=junit --outputFile=out/pr-js.xml

      - name: Acceptance tests, hardened (JavaScript, AsBuild's own Vitest settings, no setup files)
        if: hashFiles('tests/acceptance/**/*.test.*') != ''
        continue-on-error: true
        timeout-minutes: 3
        run: >-
          node_modules/.bin/vitest run --config "$ASBUILD/engine/js/vitest.acceptance.mjs" --root .
          --reporter=junit --outputFile=out/acceptance-js.xml

      - name: Fails before, each acceptance test file laid over main
        continue-on-error: true
        run: python "$ASBUILD/engine/c3_overlay.py" --base "origin/${{ github.base_ref }}" --out out/c3

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: asbuild-evidence
          path: out/
          retention-days: 7
