[project]
name = "asbuild"
version = "0.0.0"
description = "Checks an AI agent's pull request against tests a person approved, with a plain receipt."
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
junit_family = "xunit2"

[tool.coverage.run]
source = ["engine", "plugin/scripts"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
exclude = ["tests/acceptance/**"]  # locked tests are never reformatted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/acceptance/**" = ["E501"]  # locked tests are never rewrapped

[tool.mypy]
python_version = "3.12"
files = ["engine", "plugin/scripts"]
ignore_missing_imports = true
